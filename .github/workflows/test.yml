name: Test
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Install Go
      uses: actions/setup-go@v5
      with:
        go-version-file: go.mod
    - name: Check formatting
      run: |
        test -z "$(gofmt -l .)" || { gofmt -d .; exit 1; }
    - name: Check go.mod
      run: |
        go mod tidy
        git diff --exit-code go.mod go.sum
    - name: Vet
      run: go vet ./...
    - name: Test
      run: go test -race ./...
  generate:
    name: Generate
    runs-on: ubuntu-latest
    steps:
    - name: Install Go
      uses: actions/setup-go@v5
      with:
        go-version: stable
    - name: Checkout cdproto-gen
      uses: actions/checkout@v4
    - name: Checkout cdproto
      uses: actions/checkout@v4
      with:
        repository: chromedp/cdproto
        path: cdproto
    - name: Generate
      run: go run . --out cdproto
    - name: Build
      working-directory: cdproto
      run: |
        go build ./...
        go vet ./...
